[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xanther-memory-engine"
version = "0.1.0"
description = "Generic persistent memory for AI coding assistants — episodic, facts, working context"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["memory", "ai", "agents", "mcp", "knowledge-graph", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "sentence-transformers>=2.7,<4.0",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.0,<6.0"]
opensearch = ["opensearch-py>=2.4,<3.0"]
llm = ["openai>=1.0,<2.0"]
full = [
    "neo4j>=5.0,<6.0",
    "opensearch-py>=2.4,<3.0",
    "openai>=1.0,<2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
xme = "xme.cli:main"

[project.urls]
Homepage = "https://github.com/Xanther-Ai/xanther-memory-engine"
Repository = "https://github.com/Xanther-Ai/xanther-memory-engine"
Issues = "https://github.com/Xanther-Ai/xanther-memory-engine/issues"

[tool.hatch.build.targets.wheel]
packages = ["xme"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
